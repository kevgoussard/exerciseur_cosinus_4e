<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trigonométrie : calculer une longueur avec le cosinus</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbfcff; --grid:#dbe4f7; --ink:#1b2a4a; --muted:#5b6a8a;
  --known:#1f5fd6; --unknown:#c0267a; --hl:#ffe66d; --hl-edge:#d9b400;
  --ok:#157a3d; --ok-bg:#e3f6e9; --bad:#b42318; --bad-bg:#fdeceb; --btn:#1b2a4a;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font:18px/1.5 "Trebuchet MS",system-ui,sans-serif;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px; min-height:100vh;
}
main{max-width:1100px; margin:0 auto; padding:20px 16px 48px}
header{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
h1{font-size:1.5rem; margin:0}
.sub{margin:0; color:var(--muted); font-size:1rem}
.dots{display:flex; gap:8px; align-items:center}
.dot{width:16px; height:16px; border-radius:50%; border:2px solid var(--ink); background:#fff}
.dot.now{background:var(--hl); border-color:var(--hl-edge)}
.dot.done{background:var(--ink)}
.card{background:#fff; border:2px solid var(--ink); border-radius:12px; padding:16px; margin-top:16px}
.enonce{margin:0; font-size:1.1rem}
.fig{position:relative; container-type:inline-size; margin:12px auto 0}
.fig svg{display:block; width:100%; height:auto}
.fig text{font-family:inherit}
.bubble{
  position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; gap:.3em;
  font-size:clamp(14px,3.3cqw,21px); background:var(--hl); border:2px solid var(--hl-edge);
  border-radius:1.2em; padding:.35em .6em; white-space:nowrap; font-weight:700;
}
.bubble.ok{background:var(--ok-bg); border-color:var(--ok)}
.bubble select{font:inherit; font-weight:700; border:2px solid var(--ink); border-radius:.4em; padding:.15em .2em; background:#fff; color:var(--ink); cursor:pointer}
.bubble input{
  width:3em; font:inherit; text-align:center; border:2px solid var(--ink); border-radius:.4em;
  padding:.15em; background:#fff; color:var(--ink);
}
.consigne{margin:0 0 10px; font-weight:700}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.row input{
  width:6.5em; font:inherit; font-size:1.15rem; padding:.35em .5em; border:2px solid var(--ink);
  border-radius:8px; text-align:right;
}
button.main{
  font:inherit; font-weight:700; background:var(--btn); color:#fff; border:2px solid var(--btn);
  border-radius:10px; padding:.5em 1.1em; cursor:pointer;
}
button.main:hover{background:#2c3f6b}
button:disabled,input:disabled{opacity:.7; cursor:not-allowed}
:focus-visible{outline:3px solid var(--known); outline-offset:2px}
.msg{margin:12px 0 0; padding:10px 12px; border-radius:8px; border:2px solid transparent; min-height:0}
.msg:empty{display:none}
.msg.ok{background:var(--ok-bg); border-color:var(--ok); color:var(--ok)}
.msg.bad{background:var(--bad-bg); border-color:var(--bad); color:var(--bad)}
.msg.info{background:#eef3ff; border-color:var(--known); color:var(--ink)}
.hint{color:var(--muted); font-size:.9rem; margin:8px 0 0}
#next{margin-top:0}
.score{font-size:4rem; font-weight:700; margin:.2em 0; line-height:1}
.end{text-align:center}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.fig.vert{max-width:460px; margin-left:auto; margin-right:auto}
.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.25; margin:0 .2em}
.frac>span:first-child{border-bottom:2px solid currentColor; padding:0 .4em .05em}
.frac>span:last-child{padding-top:.05em}
.frac .one{opacity:.35}
.rappel{display:block; margin-top:8px; color:var(--ink)}
.envoi{max-width:460px; margin:20px auto 0; text-align:left; border-top:2px dashed #b9c6e6; padding-top:16px}
.champs{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.champs label{flex:1 1 160px; display:flex; flex-direction:column; font-weight:700}
.champs input{font:inherit; padding:.4em .5em; border:2px solid var(--ink); border-radius:8px; margin-top:4px; background:#fff; color:var(--ink)}
.end .msg{text-align:left; max-width:460px; margin-left:auto; margin-right:auto}
#restart{margin-top:18px}
.work{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:16px;align-items:start}
@media(max-width:860px){.work{grid-template-columns:1fr}}
.fig.noarrow .arrow,.fig.noarrow .bubble{display:none}
.pill{margin-left:10px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:700;white-space:nowrap}
.hat{position:relative;display:inline-block;line-height:1}
.hat::after{content:"";position:absolute;left:50%;top:-.2em;width:.3em;height:.3em;border-left:.09em solid currentColor;border-top:.09em solid currentColor;transform:translateX(-50%) rotate(45deg)}
.natbox select{font-family:"Segoe UI",Arial,Helvetica,sans-serif}
.natbox{position:absolute;transform:translate(-50%,-50%);white-space:nowrap}
.nat{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 10px;font-weight:700}
.natbox select{font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:.25em .4em;background:#fff;color:var(--ink);cursor:pointer}
.natbox select.ok{background:var(--ok-bg);border-color:var(--ok)}
.natbox select.bad{background:var(--bad-bg);border-color:var(--bad)}
.natbox select:disabled{opacity:1;color:var(--ink);cursor:default;appearance:none;-webkit-appearance:none;padding-right:.5em}
.proof{border:2px solid var(--ink);border-radius:10px;padding:12px 14px 12px 44px;position:relative;min-height:200px;line-height:30px;background-color:#fff;background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 30px;background-position:0 12px;overflow-wrap:anywhere}
.proof::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:#e5484d;opacity:.55}
.proof>strong{display:block;line-height:30px;color:var(--ink)}
.proof p{margin:0;font-family:Kalam,"Comic Sans MS",cursive;font-size:1.05rem;color:#26307a}
.proof p.vide{font-family:inherit;font-size:.9rem;color:var(--muted)}
.proof .f{font-weight:700;color:var(--ink)}
[hidden]{display:none !important}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Trigonométrie</h1>
      <p class="sub">Calculer une longueur en utilisant le cosinus</p>
    </div>
    <div class="dots" id="dots" aria-label="Progression"></div>
  </header>

  <section id="quiz" class="card">
    <p class="enonce" id="enonce"></p>
    <div class="work"><div>
    <div class="fig noarrow" id="fig"></div>

    <div id="step0" style="margin-top:12px">
      <p class="consigne" id="consigne0"></p>
      <button class="main" id="btn0">Vérifier</button>
    </div>

    <div id="step1" hidden style="margin-top:12px">
      <p class="consigne">Étape 2 : complète la bulle jaune.</p>
      <button class="main" id="btn1">Vérifier</button>
    </div>

    <div id="step2" hidden style="margin-top:12px">
      <p class="consigne" id="consigne2"></p>
      <div class="row">
        <label for="len" class="sr" id="lenLabel"></label>
        <input id="len" inputmode="decimal" autocomplete="off"> <span>cm</span>
        <button class="main" id="btn2">Vérifier</button>
        <button class="main" id="next" hidden></button>
      </div>
    </div>

    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </div>
    <aside class="proof"><strong>Rédaction</strong><div id="red"></div></aside>
    </div>
  </section>

  <section id="end" class="card end" hidden>
    <p class="enonce">Ton score</p>
    <p class="score" id="score"></p>
    <p id="bilan"></p>
    <form id="envoi" class="envoi" novalidate>
      <p class="consigne">Envoie ton résultat à ton professeur :</p>
      <div class="champs">
        <label>Prénom <input id="prenom" maxlength="40" autocomplete="off" required></label>
        <label>Classe <input id="classe" maxlength="20" autocomplete="off" placeholder="ex. : 3e A" required></label>
      </div>
      <button class="main" id="btnEnvoi" type="submit">Envoyer mon score</button>
    </form>
    <div class="msg" id="msgEnvoi" role="status" aria-live="polite"></div>
    <button class="main" id="restart">Recommencer</button>
  </section>
</main>

<script>
/* ---------- Configuration EmailJS (à remplir, voir les explications) ---------- */
const EMAILJS = {
  publicKey:  "ATJ81EsZMjUM7kMEV",
  serviceId:  "service_ddxhm89",
  templateId: "template_ycpslgy"
};

const NB_QUESTIONS = 5;
const ESSAIS_LONGUEUR = 2;   // nombre d'essais pour la longueur (étape 2)
const NOMS = [["A","B","C"],["E","F","G"],["K","L","M"],["R","S","T"],["D","E","F"]];

const $ = id => document.getElementById(id);
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const fr = x => String(x).replace(".", ",");
// Nom d'un angle avec le chapeau sur le sommet : angle de sommet a entre [ab] et [ac] -> B Â C
const angleTxt = (a, b, c) => b + a + "\u0302" + c;            // texte brut (menus déroulants)
const angleNom = (a, b, c) => `${b}<span class="hat">${a}</span>${c}`;   // HTML : chapeau dessiné en CSS
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let questions, idx, score, op, essais, etape, erreur1, red = [];

/* ---------- Génération ---------- */
function creerQuestion(type) {
  const noms = NOMS[rand(0, NOMS.length - 1)];
  for (;;) {
    const ang = rand(20, 70);
    const connu = type === "mult" ? rand(6, 15) : rand(4, 12);
    const cos = Math.cos(ang * Math.PI / 180);
    const exact = type === "mult" ? connu * cos : connu / cos;
    const f = exact * 10 - Math.floor(exact * 10);
    if (Math.abs(f - 0.5) < 0.08) continue;      // évite les arrondis ambigus
    return { type, noms, ang, connu, reponse: Math.round(exact * 10) / 10,
             opAttendue: type === "mult" ? "×" : "÷" };
  }
}
function nouvellePartie() {
  const types = shuffle(["mult", "mult", "div", "div", Math.random() < 0.5 ? "mult" : "div"]);
  const orients = shuffle([0, 1, 2, 3, 4, 5, 6, 7]);   // 8 orientations (symétrie + rotations), toutes différentes
  questions = types.slice(0, NB_QUESTIONS).map((t, k) => ({ ...creerQuestion(t), orient: orients[k], gain: 0, permut: Math.random() < 0.5 }));
  idx = 0; score = 0;
  $("quiz").hidden = false; $("end").hidden = true;
  afficher();
}

/* ---------- Figure ---------- */
function figure(q) {
  const [a, b, c] = q.noms;
  const mx = q.orient & 1, k = q.orient >> 1;                   // symétrie, puis k quarts de tour
  const C0 = { x: 278, y: 213 };
  const lin = v => { let x = mx ? -v.x : v.x, y = v.y; for (let i = 0; i < k; i++) [x, y] = [-y, x]; return { x, y }; };
  const T = p => lin({ x: p.x - C0.x, y: p.y - C0.y });
  const f = p => { const t = T(p); return `${t.x.toFixed(1)} ${t.y.toFixed(1)}`; };
  const boites = [], lboxes = {};                                            // pour calculer le cadre de la figure
  const pt = p => { const t = T(p); boites.push([t.x, t.y, t.x, t.y]); };
  const lab = (p, off, size, fill, contenu, key) => {
    const t = T({ x: p.x + off.x, y: p.y + off.y }), len = Math.hypot(off.x, off.y) || 1, r = lin(off).x / len;
    const anc = r > 0.3 ? "start" : r < -0.3 ? "end" : "middle";
    const w = contenu.length * size * 0.62, x0 = anc === "start" ? t.x : anc === "end" ? t.x - w : t.x - w / 2;
    boites.push([x0, t.y - size * 0.6, x0 + w, t.y + size * 0.6]);
    if (key) lboxes[key] = [x0, t.y - size * 0.6, x0 + w, t.y + size * 0.6];
    return `<text x="${t.x.toFixed(1)}" y="${t.y.toFixed(1)}" font-size="${size}" font-weight="700" text-anchor="${anc}" dominant-baseline="central" fill="${fill}">${contenu}</text>`;
  };

  const th = q.ang * Math.PI / 180, cs = Math.cos(th), sn = Math.sin(th), H = 260;
  const A = { x: 250, y: 290 }, B = { x: A.x + H * cs, y: A.y }, C = { x: B.x, y: A.y - H * sn };
  const AB = H * cs, n = { x: -sn, y: -cs };
  const pos = (phi, r) => ({ x: A.x + r * Math.cos(phi), y: A.y - r * Math.sin(phi) });
  [A, B, C].forEach(pt);

  // Flèche : arc autour du sommet A, toujours à l'extérieur du triangle
  const d = Math.min(48, 0.45 * AB), R = 135, marge = 9 * Math.PI / 180;
  const p0 = th + marge, p1 = 2 * Math.PI - marge, pts = [];
  for (let m = 0; m <= 48; m++) { const t = m / 48; pts.push(pos(p0 + (p1 - p0) * t, d + (R - d) * Math.sin(Math.PI * t))); }
  pts.forEach(pt);
  const sens = q.type === "mult" ? pts : pts.slice().reverse();
  const chemin = "M " + sens.map(f).join(" L ");
  const M = T(pos((p0 + p1) / 2, R));                           // centre de la bulle
  const BW = 172, BH = 46;
  boites.push([M.x - BW / 2, M.y - BH / 2, M.x + BW / 2, M.y + BH / 2]);

  const hyp = a + c, adj = a + b;
  const txtHyp = q.type === "mult" ? `${hyp} = ${fr(q.connu)} cm` : `${hyp} = ?`;
  const txtAdj = q.type === "mult" ? `${adj} = ?` : `${adj} = ${fr(q.connu)} cm`;
  const colHyp = q.type === "mult" ? "var(--known)" : "var(--unknown)";
  const colAdj = q.type === "mult" ? "var(--unknown)" : "var(--known)";
  const ph = { x: A.x + (C.x - A.x) * .8, y: A.y + (C.y - A.y) * .8 };
  const pa = { x: A.x + Math.max(AB / 2, 125), y: A.y };
  const ar = 38, sweep = mx ? 1 : 0;

  // Menus placés sous l'étiquette : si l'étiquette est au-dessus de son segment, on l'éloigne pour laisser la place au menu
  const extra = (dir, base) => { const u = lin(dir), len = Math.hypot(u.x, u.y) || 1, ux = u.x / len, uy = u.y / len; return (Math.abs(ux) <= 0.6 && uy < -0.2) ? base + Math.min(150, 40 / Math.abs(uy)) : base; };
  const hOff = extra({ x: n.x, y: n.y }, 30), aOff = extra({ x: 0, y: 1 }, 34);
  const corps = `
    <polygon points="${f(A)} ${f(B)} ${f(C)}" fill="#f1f5ff" stroke="#1b2a4a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M ${f({ x: B.x - 16, y: B.y })} L ${f({ x: B.x - 16, y: B.y - 16 })} L ${f({ x: B.x, y: B.y - 16 })}" fill="none" stroke="#1b2a4a" stroke-width="2"/>
    <path d="M ${f({ x: A.x + ar, y: A.y })} A ${ar} ${ar} 0 0 ${sweep} ${f({ x: A.x + ar * cs, y: A.y - ar * sn })}" fill="none" stroke="#1b2a4a" stroke-width="2"/>
    ${lab(pos(th / 2, 70), { x: 0, y: 0 }, 16, "#1b2a4a", q.ang + "°")}
    <path class="arrow" d="${chemin}" fill="none" stroke="#1b2a4a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah)"/>
    ${lab(A, { x: -14, y: 10 }, 20, "#1b2a4a", a)}
    ${lab(B, { x: 14, y: 10 }, 20, "#1b2a4a", b)}
    ${lab(C, { x: 14, y: -10 }, 20, "#1b2a4a", c)}
    ${lab(ph, { x: hOff * n.x, y: hOff * n.y }, 19, colHyp, txtHyp, "hyp")}
    ${lab(pa, { x: 0, y: aOff }, 19, colAdj, txtAdj, "adj")}`;

  // Menus de l'étape 1 : posés à côté de l'étiquette de chaque côté, en s'éloignant du segment
  const optLong = `côté adjacent à l'angle ${angleTxt(a, b, c)}`, FS = 15, SW = Math.round((optLong.length + 3) * FS * 0.52 + 30), SH = 30;
  const selPos = {}, placed = [];
  const R4 = bx => ({ x1: bx[0], y1: bx[1], x2: bx[2], y2: bx[3] });
  const ovl = (r, b) => Math.max(0, Math.min(r.x2, b.x2) - Math.max(r.x1, b.x1)) * Math.max(0, Math.min(r.y2, b.y2) - Math.max(r.y1, b.y1));
  const obst = pts.map(T);                                       // flèche
  [[A, B], [A, C], [B, C]].forEach(([p1, p2]) => { for (let i = 0; i <= 20; i++) obst.push(T({ x: p1.x + (p2.x - p1.x) * i / 20, y: p1.y + (p2.y - p1.y) * i / 20 })); });
  const bub = { x1: M.x - BW / 2, x2: M.x + BW / 2, y1: M.y - BH / 2, y2: M.y + BH / 2 };
  [["hyp", { x: n.x, y: n.y }, "adj"], ["adj", { x: 0, y: 1 }, "hyp"]].forEach(([k, dir, autre]) => {
    const bx = lboxes[k], lx = (bx[0] + bx[2]) / 2, ly = (bx[1] + bx[3]) / 2, lw = bx[2] - bx[0];
    const u = lin(dir), ux = u.x / (Math.hypot(u.x, u.y) || 1), sg = Math.abs(ux) > 0.3 ? Math.sign(ux) : 0;
    const xa = sg > 0 ? bx[0] + SW / 2 : sg < 0 ? bx[2] - SW / 2 : lx, yb = bx[3] + 6 + SH / 2, dh = lw / 2 + SW / 2 + 10, s1 = sg || 1;
    let best = null, bc = 1e12;
    [[xa, yb], [lx, yb], [lx + s1 * dh, ly], [lx - s1 * dh, ly], [xa, bx[1] - 6 - SH / 2]].forEach(([x, y], i) => {
      const r = { x1: x - SW / 2 - 4, x2: x + SW / 2 + 4, y1: y - SH / 2 - 4, y2: y + SH / 2 + 4 };
      const c = i * 5 + obst.filter(o => o.x > r.x1 && o.x < r.x2 && o.y > r.y1 && o.y < r.y2).length * 40
        + ovl(r, bub) + ovl(r, R4(lboxes[autre])) * 2 + placed.reduce((t, b) => t + ovl(r, b), 0) * 2;
      if (c < bc) { bc = c; best = { x, y }; }
    });
    selPos[k] = best;
    placed.push({ x1: best.x - SW / 2, x2: best.x + SW / 2, y1: best.y - SH / 2, y2: best.y + SH / 2 });
    boites.push([best.x - SW / 2, best.y - SH / 2, best.x + SW / 2, best.y + SH / 2]);
  });

  // Cadre ajusté au contenu (avec une taille minimale), centré
  const x0 = Math.min(...boites.map(t => t[0])), x1 = Math.max(...boites.map(t => t[2]));
  const y0 = Math.min(...boites.map(t => t[1])), y1 = Math.max(...boites.map(t => t[3]));
  const W = Math.max(x1 - x0 + 24, 480), Hh = Math.max(y1 - y0 + 24, 320);
  const vx = (x0 + x1) / 2 - W / 2, vy = (y0 + y1) / 2 - Hh / 2;

  const svg = `
  <svg viewBox="${vx.toFixed(1)} ${vy.toFixed(1)} ${W.toFixed(1)} ${Hh.toFixed(1)}" role="img" aria-label="Triangle ${a}${b}${c} rectangle en ${b}, angle de ${q.ang} degrés en ${a}">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a4a"/></marker></defs>${corps}
  </svg>`;
  const bulle = `
  <div class="bubble" id="bubble" style="left:${((M.x - vx) / W * 100).toFixed(2)}%;top:${((M.y - vy) / Hh * 100).toFixed(2)}%;font-size:max(11px,${(15 / W * 100).toFixed(2)}cqw)">
    <select id="opSel" aria-label="Choisir × ou ÷">
      <option value="">?</option><option value="×">×</option><option value="÷">÷</option>
    </select>
    <span>cos(</span><input id="ang" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="angle"><span>°)</span>
  </div>`;
  const optsH = `<option value="">?</option><option value="hyp">hypoténuse</option><option value="adj">${optLong}</option>`;
  const menus = ["hyp", "adj"].map(k => `
  <div class="natbox" style="left:${((selPos[k].x - vx) / W * 100).toFixed(2)}%;top:${((selPos[k].y - vy) / Hh * 100).toFixed(2)}%;font-size:max(11px,${(FS / W * 100).toFixed(2)}cqw)">
    <select id="nat_${k}" data-att="${k}" aria-label="Nature du côté ${k === "hyp" ? hyp : adj}">${optsH}</select>
  </div>`).join("");
  return { html: svg + bulle + menus, maxw: Math.round(W * 1.25), ratio: W / Hh };
}

/* ---------- Affichage ---------- */
function afficher() {
  const q = questions[idx], [a, b, c] = q.noms;
  op = null; essais = 0; etape = 0; erreur1 = false; red = [];
  $("dots").innerHTML = questions.map((_, i) =>
    `<span class="dot ${i < idx ? "done" : i === idx ? "now" : ""}"></span>`).join("") +
    `<span style="margin-left:6px;font-weight:700">Question ${idx + 1} / ${NB_QUESTIONS}</span>` +
    `<span class="pill" id="scoreLive">Score : ${fr(score)} / ${NB_QUESTIONS}</span>`;
  const inconnue = q.type === "mult" ? a + b : a + c;
  const donnee = q.type === "mult" ? `${a}${c} = ${fr(q.connu)} cm` : `${a}${b} = ${fr(q.connu)} cm`;
  $("enonce").innerHTML = `Le triangle ${a}${b}${c} est rectangle en ${b}. On a ${angleNom(a, b, c)} = ${q.ang}° et ${donnee}. Calcule ${inconnue}.`;
  const fg = figure(q);
  $("fig").innerHTML = fg.html; $("fig").style.maxWidth = `min(${fg.maxw}px, ${(50 * fg.ratio).toFixed(1)}vh)`;
  $("consigne2").textContent = `Étape 3 : calcule ${inconnue} et écris sa longueur arrondie au dixième.`;
  $("lenLabel").textContent = `Longueur de ${inconnue}`;
  $("step0").hidden = false; $("step1").hidden = true; $("step2").hidden = true; $("next").hidden = true;
  $("fig").classList.add("noarrow"); $("btn0").disabled = false; preparerNat(q);
  $("len").value = ""; $("len").disabled = false; $("btn2").disabled = false;
  message("", "");
  $("opSel").onchange = e => { op = e.target.value || null; };
}
function rendreRed() {
  $("red").innerHTML = red.length ? red.map(l => `<p>${l}</p>`).join("") : `<p class="vide">La rédaction s'écrira au fil des étapes.</p>`;
}
function preparerNat(q) {
  const [a, b, c] = q.noms;
  $("consigne0").innerHTML = `Étape 1 : avec les menus de la figure, indique la nature des côtés [${a + c}] et [${a + b}] pour l'angle ${angleNom(a, b, c)}.`;
  ["hyp", "adj"].forEach(k => { const sel = $("nat_" + k); sel.onchange = () => { sel.className = ""; }; });
  rendreRed();
}
function message(txt, type, html) {
  const m = $("msg"); if (html) m.innerHTML = txt; else m.textContent = txt; m.className = "msg " + type;
  if (txt) m.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

/* ---------- Étape 1 : nature des côtés ---------- */
function verifier0() {
  const q = questions[idx], [a, b, c] = q.noms, sels = [$("nat_hyp"), $("nat_adj")];
  if (sels.some(x => !x.value)) return message("Choisis une réponse dans chacun des deux menus.", "info");
  const ok = sels.map(x => x.value === x.dataset.att);
  sels.forEach((x, i) => { x.className = ok[i] ? "ok" : "bad"; });
  if (ok[0] && ok[1]) {
    sels.forEach(x => { x.disabled = true; }); $("btn0").disabled = true;
    red.push(`Le triangle ${a}${b}${c} est rectangle en ${b}.`, `L'hypoténuse est [${a + c}].`, `Le côté adjacent à l'angle ${angleNom(a, b, c)} est [${a + b}].`);
    rendreRed();
    $("fig").classList.remove("noarrow"); $("step0").hidden = true; $("step1").hidden = false; etape = 1;
    return message("Bien ! Une flèche et une bulle jaune sont apparues sur la figure : complète la bulle.", "ok");
  }
  erreur1 = true;
  message(`Rappel : l'hypoténuse est le côté opposé à l'angle droit. Le côté adjacent à l'angle ${angleNom(a, b, c)} est l'autre côté de cet angle.`, "bad", true);
}

/* ---------- Étape 2 : × ou ÷ et cos(angle) ---------- */
function verifier1() {
  const q = questions[idx];
  const val = parseInt($("ang").value.replace(/[^\d]/g, ""), 10);
  if (!op) return message("Choisis × ou ÷ dans le menu de la bulle.", "info");
  if (isNaN(val)) return message("Complète cos( ) avec l'angle.", "info");
  const okOp = op === q.opAttendue, okAng = val === q.ang;
  if (okOp && okAng) {
    $("bubble").classList.add("ok");
    $("opSel").disabled = true; $("ang").disabled = true;
    $("step1").hidden = true; $("step2").hidden = false; etape = 2;
    const [a1, b1, c1] = q.noms, inc = q.type === "mult" ? a1 + b1 : a1 + c1;
    red.push(`On a : <span class="f">${inc} = ${fr(q.connu)} ${op} cos(${q.ang}°)</span>`); rendreRed();
    message("Bien ! Utilise maintenant ta calculatrice pour conclure.", "ok");
    $("len").focus();
    return;
  }
  erreur1 = true;                                    // un 2e essai sera nécessaire : 0,5 point au lieu de 1
  const [a, b, c] = q.noms;
  const depart = q.type === "mult" ? `[${a}${c}] (l'hypoténuse)` : `[${a}${b}] (le côté adjacent)`;
  const arrivee = q.type === "mult" ? `[${a}${b}] (le côté adjacent)` : `[${a}${c}] (l'hypoténuse)`;
  let html = "";
  if (!okOp) html += `Regarde le sens de la flèche : on part de ${depart} pour aller vers ${arrivee}.` +
    `<span class="rappel">Rappel : <span class="frac"><span>cos(angle)</span><span class="one">1</span></span> = ` +
    `<span class="frac"><span>côté adjacent</span><span>hypoténuse</span></span></span>`;
  if (!okAng) html += (html ? "<br>" : "") + "Dans cos( ), on écrit la mesure de l'angle aigu connu, celui qui est marqué sur la figure.";
  message(html, "bad", true);
}

/* ---------- Étape 2 : longueur ---------- */
function verifier2() {
  const q = questions[idx], [a, b, c] = q.noms;
  const brut = $("len").value.trim().replace(",", ".").replace(/\s*cm$/i, "");
  const v = parseFloat(brut);
  if (brut === "" || isNaN(v)) return message("Écris un nombre, par exemple 7,5.", "info");
  essais++;
  if (Math.abs(v - q.reponse) < 0.001) {
    const gain = (erreur1 || essais > 1) ? 0.5 : 1;
    score += gain; q.gain = gain; $("scoreLive").textContent = `Score : ${fr(score)} / ${NB_QUESTIONS}`;
    const eq = q.type === "mult" ? `${a}${b} = ${a}${c} × cos(${q.ang}°) = ${fr(q.reponse)} cm`
                                 : `${a}${c} = ${a}${b} ÷ cos(${q.ang}°) = ${fr(q.reponse)} cm`;
    red.push(`${q.type === "mult" ? a + b : a + c} ≈ ${fr(q.reponse)} cm`); rendreRed();
    return fin("ok", `${gain === 1 ? "Bravo !" : "Bien !"}<br>${gain === 1 ? "+1 point" : "+0,5 point (il t'a fallu un deuxième essai)"}`, true);
  }
  if (essais < ESSAIS_LONGUEUR) {
    return message("Pas tout à fait. Vérifie ton calcul et ton arrondi au dixième, puis réessaie.", "bad");
  }
  const calcul = q.type === "mult" ? `${a}${b} = ${fr(q.connu)} × cos(${q.ang}°)` : `${a}${c} = ${fr(q.connu)} ÷ cos(${q.ang}°)`;
  red.push(`${q.type === "mult" ? a + b : a + c} ≈ ${fr(q.reponse)} cm`); rendreRed();
  fin("bad", `Ce n'est pas ça. La bonne réponse était ${fr(q.reponse)} cm : ${calcul}.`);
}
function fin(type, txt, html) {
  message(txt, type, html);
  $("len").disabled = true; $("btn2").disabled = true;
  const dernier = idx === NB_QUESTIONS - 1;
  $("next").textContent = dernier ? "Voir mon score" : "Question suivante";
  $("next").hidden = false;
}
function suivante() {
  if (idx < NB_QUESTIONS - 1) { idx++; afficher(); return; }
  $("quiz").hidden = true; $("end").hidden = false;
  $("dots").innerHTML = "";
  $("envoi").hidden = false; $("btnEnvoi").disabled = false; $("btnEnvoi").textContent = "Envoyer mon score";
  messageEnvoi("", "");
  $("score").textContent = `${fr(score)} / ${NB_QUESTIONS}`;
  $("bilan").textContent = score === NB_QUESTIONS ? "Sans faute, bravo !"
    : score >= 3 ? "Bon travail ! Encore un essai pour viser le sans-faute ?"
    : "Continue à t'entraîner : relis la méthode et recommence.";
}

/* ---------- Envoi du score par mail (EmailJS) ---------- */
function messageEnvoi(txt, type) { const m = $("msgEnvoi"); m.textContent = txt; m.className = "msg " + type; }
function envoyer(e) {
  e.preventDefault();
  const prenom = $("prenom").value.trim(), classe = $("classe").value.trim();
  if (!prenom || !classe) return messageEnvoi("Écris ton prénom et ta classe avant d'envoyer.", "info");
  if (EMAILJS.publicKey.startsWith("VOTRE")) return messageEnvoi("L'envoi par mail n'est pas encore configuré (clés EmailJS à renseigner dans le code).", "bad");
  if (typeof emailjs === "undefined") return messageEnvoi("Le service d'envoi n'a pas pu se charger. Montre ton score à ton professeur.", "bad");
  const params = {
    exerciseur: "Trigonométrie - Calculer une longueur avec le cosinus",
    prenom, classe,
    score: `${fr(score)} / ${NB_QUESTIONS}`,
    date: new Date().toLocaleString("fr-FR")
  };
  $("btnEnvoi").disabled = true; $("btnEnvoi").textContent = "Envoi en cours…";
  messageEnvoi("", "");
  emailjs.send(EMAILJS.serviceId, EMAILJS.templateId, params, { publicKey: EMAILJS.publicKey })
    .then(() => { $("envoi").hidden = true; messageEnvoi(`Merci ${prenom} ! Ton score a bien été envoyé à ton professeur.`, "ok"); })
    .catch(() => {
      $("btnEnvoi").disabled = false; $("btnEnvoi").textContent = "Envoyer mon score";
      messageEnvoi("L'envoi a échoué. Vérifie ta connexion et réessaie. Sinon, montre ton score à ton professeur.", "bad");
    });
}

$("envoi").onsubmit = envoyer;
$("btn0").onclick = verifier0;
$("btn1").onclick = verifier1;
$("btn2").onclick = verifier2;
$("next").onclick = suivante;
$("restart").onclick = nouvellePartie;
nouvellePartie();
</script>
</body>
</html>
